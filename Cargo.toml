[package]
name = "kaw"
version = "0.1.5"
edition = "2024"

[dependencies]
deno_core = { version = "0.403.0", default-features = false, features = ["reactor-tokio"] }
tokio = { version = "1.52.3", default-features = false }

[dev-dependencies]
assert_cmd = "2.2.2"

[build-dependencies]
deno_core = "0.403.0"

[profile.release]
codegen-units = 1
lto = true
panic = "abort"
strip = true
